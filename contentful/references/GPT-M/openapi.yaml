openapi: 3.1.0
info:
  title: LP Builder Contentful Actions (Dev)
  version: 1.0.0
  description: Create, update, read, publish, unpublish, archive, unarchive, and delete lpBuilder pages in Contentful through the Dev OAuth integration.
servers:
  - url: https://mc2qso3oc7.execute-api.eu-west-1.amazonaws.com
    description: Dev LP Builder API Gateway deployment. The /box stage prefix is baked into every path below rather than kept in this base URL, in case a client's OpenAPI parser drops a non-empty server base path when splitting host from path.
security:
  - oauth2: [lp_builder]
paths:
  /box/actions/lp-builder/drafts:
    post:
      operationId: createLpBuilderDraft
      summary: Create an LP Builder draft
      description: Creates a Contentful lpBuilder draft. This operation never publishes the entry. The returned previewUrl is the sandbox URL for reviewing the draft.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftInput'
      responses:
        '200':
          description: Draft created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /box/actions/lp-builder/update:
    post:
      operationId: updateLpBuilderDraft
      summary: Update an LP Builder draft
      description: Updates htmlSource, metadata, and/or the public slug. Identify the entry with entryId or slug. This operation never publishes the entry.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInput'
      responses:
        '200':
          description: Draft updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /box/actions/lp-builder/publish:
    post:
      operationId: publishLpBuilderDraft
      summary: Publish an LP Builder draft
      description: Explicitly publishes an existing reviewed Contentful lpBuilder draft.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntrySelector'
      responses:
        '200':
          description: Entry published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /box/actions/lp-builder/unpublish:
    post:
      operationId: unpublishLpBuilderPage
      summary: Unpublish an LP Builder page
      description: Removes the published version and leaves the entry as a draft.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntrySelector'
      responses:
        '200':
          description: Entry unpublished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /box/actions/lp-builder/archive:
    post:
      operationId: archiveLpBuilderPage
      summary: Archive an LP Builder page
      description: Archives an unpublished entry. Unpublish it first when it is currently published.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntrySelector'
      responses:
        '200':
          description: Entry archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /box/actions/lp-builder/unarchive:
    post:
      operationId: unarchiveLpBuilderPage
      summary: Restore an archived LP Builder page
      description: Restores an archived lpBuilder entry to draft state. Use entryId as the stable identifier when restoring an archived entry.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntrySelector'
      responses:
        '200':
          description: Entry restored to draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /box/actions/lp-builder/delete:
    post:
      operationId: deleteLpBuilderPage
      summary: Delete an LP Builder page
      description: Permanently deletes an unpublished entry. Unpublish it first when it is currently published.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntrySelector'
      responses:
        '200':
          description: Entry deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /box/actions/lp-builder/pages:
    get:
      operationId: getLpBuilderPage
      summary: Read an LP Builder page
      description: Reads the complete draft fields and publication metadata for a Contentful lpBuilder entry by slug. The response includes the exact HTML, length, and SHA-256. The internal htmlSourcePayload storage field is omitted to avoid returning the HTML twice.
      parameters:
        - name: slug
          in: query
          required: true
          description: The LP Builder slug, including its leading slash, for example /lp-test2.
          schema:
            type: string
          example: '/lp-test2'
      responses:
        '200':
          description: LP Builder page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /box/actions/lp-builder/page-by-id/{entryId}:
    get:
      operationId: getLpBuilderPageById
      summary: Read an LP Builder page by entry ID
      description: Reads an lpBuilder entry by its stable Contentful entry ID. The internal htmlSourcePayload storage field is omitted from fields because htmlSource already contains the exact HTML.
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: LP Builder page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /box/actions/lp-builder/openai-schema:
    get:
      operationId: getOpenApiSchema
      summary: Get the OpenAPI schema
      description: Returns this OpenAPI document as YAML. This public endpoint is intended for importing the LP Builder Actions definition into ChatGPT.
      responses:
        '200':
          description: OpenAPI document in YAML format.
          content:
            application/yaml:
              schema:
                type: string
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://mc2qso3oc7.execute-api.eu-west-1.amazonaws.com/box/oauth/authorize
          tokenUrl: https://mc2qso3oc7.execute-api.eu-west-1.amazonaws.com/box/oauth/token
          scopes:
            lp_builder: Create and update Dev LP Builder Contentful drafts.
  schemas:
    EntrySelector:
      type: object
      description: Provide either entryId or slug to identify the LP Builder entry.
      properties:
        entryId:
          type: string
        slug:
          type: string
    DraftInput:
      type: object
      required: [slug, mainTitle, html]
      properties:
        slug:
          type: string
        mainTitle:
          type: string
        html:
          type: string
        showRateMe:
          type: boolean
    UpdateInput:
      type: object
      description: Provide entryId or slug and at least one field to update. Use newSlug or targetPath to change the public path.
      properties:
        entryId:
          type: string
          description: Contentful entry ID. Use entryId or slug.
        slug:
          type: string
          description: LP Builder slug. Use slug or entryId.
        html:
          type: string
          description: Complete replacement HTML. Maximum 512 KiB at the API boundary; Contentful model support is required for larger values.
        newSlug:
          type: string
          description: New public path for the entry.
        targetPath:
          type: string
          description: Alias for newSlug.
        mainTitle:
          type: string
        showRateMe:
          type: boolean
    DraftResult:
      type: object
      required: [entryId, slug, status, version, previewUrl]
      properties:
        entryId:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [draft]
        version:
          type: integer
        previewUrl:
          type: string
          format: uri
          description: Sandbox renderer URL for this draft. Open it in a new browser tab to review the unpublished draft before publishing.
    PublishedResult:
      type: object
      required: [entryId, slug, status, previewUrl]
      properties:
        entryId:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [published]
        previewUrl:
          type: string
          format: uri
          description: Production renderer URL for the published page.
    PageResult:
      type: object
      required: [entryId, slug, version, fields]
      properties:
        entryId:
          type: string
        slug:
          type: string
        version:
          type: integer
        publishedVersion:
          type: [integer, 'null']
        fields:
          type: object
          description: Contentful fields with htmlSource normalized to the exact logical HTML, including large htmlSourcePayload entries. The internal htmlSourcePayload field itself is omitted from the response to avoid duplicating the HTML.
        htmlBytes:
          type: integer
        htmlSha256:
          type: string
          description: SHA-256 of the exact UTF-8 htmlSource returned by the API.
    LifecycleResult:
      type: object
      required: [entryId, slug, status]
      properties:
        entryId:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [draft, archived, deleted]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  responses:
    BadRequest:
      description: Invalid request or Contentful validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid OAuth access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: LP Builder page was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
