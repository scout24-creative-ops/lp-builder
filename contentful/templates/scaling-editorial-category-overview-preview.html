<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scaling Editorial Rubrikübersicht – lokale Layout-Demo</title>
  <link rel="stylesheet" href="../runtime/contentful/lpbuilder-bridge.css">
  <style>
    :root {
      --color-background-brand: #3df5dc;
      --color-background-default: #fff;
      --color-background-weak: #f2f2f2;
      --color-border-focused: #3df5dc;
      --color-text-default: #333;
      --color-text-inversive: #fff;
      --color-text-weak: #6a6a69;
      --gray-1000: #333;
    }
    * { box-sizing: border-box; }
    body { color: var(--color-text-default); font-family: Arial, sans-serif; margin: 0; }
    .preview-main { overflow-x: clip; width: 100%; }
    .preview-content { margin: 0 auto; max-width: 1200px; padding-inline: 16px; width: 100%; }
    .font-heading-large-bold { font-size: 34px; line-height: 44px; }
    .font-heading-medium-bold { font-size: 26px; line-height: 36px; }
    .font-heading-small-bold { font-size: 20px; line-height: 28px; }
    .font-body-large-regular { font-size: 16px; line-height: 26px; }
    .font-body-medium-regular { font-size: 14px; line-height: 22px; }
    .font-body-small-bold { font-size: 12px; font-weight: 700; line-height: 18px; }
    .lpb-surface--weak { background: var(--color-background-weak); }
    @media (min-width: 669px) { .preview-content { padding-inline: 24px; } }
    @media (min-width: 1014px) { .preview-content { padding-inline: 32px; } }
  </style>
</head>
<body>
  <main class="preview-main">
    <div class="preview-content" id="preview-root" aria-live="polite">Vorschau wird geladen …</div>
  </main>
  <script>
    fetch('scaling-editorial-category-overview.html')
      .then(response => {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.text();
      })
      .then(html => {
        const root = document.getElementById('preview-root');
        root.innerHTML = html;
        // Preview-only inventory controls; no script belongs to the Contentful payload.
        const count = new URLSearchParams(location.search).get('articles');
        if (count !== null && /^[0-6]$/.test(count)) {
          const overview = root.querySelector('.lpb-editorial-category-overview');
          const cards = [...overview.querySelectorAll('[data-lpb-component="scaling-editorial-article-teaser"]')];
          cards.slice(Number(count)).forEach(card => card.remove());
          overview.querySelectorAll('.lpb-editorial-overview-featured, .lpb-editorial-overview-grid').forEach(area => {
            if (!area.children.length) area.remove();
          });
          if (count === '0') {
            const empty = document.createElement('div');
            empty.className = 'lpb-editorial-category-overview__empty';
            empty.innerHTML = '<p class="font-body-large-regular">Noch keine Artikel in dieser Rubrik verfügbar.</p>';
            overview.append(empty);
          }
        }
      })
      .catch(error => {
        document.getElementById('preview-root').textContent = 'Vorschau konnte nicht geladen werden: ' + error.message + '. Bitte über einen lokalen HTTP-Server öffnen.';
      });
  </script>
</body>
</html>
