<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scaling Editorial Article mit Sidebar – lokale Layout-Vorschau</title>
  <link rel="stylesheet" href="../runtime/contentful/lpbuilder-bridge.css">
  <style>
    :root {
      --color-background-brand: #3df5dc;
      --color-background-default: #fff;
      --color-background-weak: #f2f2f2;
      --color-border-default: #d9d9d9;
      --color-text-default: #333;
      --color-text-inversive: #fff;
      --color-text-weak: #6a6a69;
      --gray-1000: #333;
    }
    * { box-sizing: border-box; }
    body { color: var(--color-text-default); font-family: Arial, sans-serif; margin: 0; }
    .preview-main { overflow-x: clip; width: 100%; }
    .preview-content { margin: 0 auto; max-width: 1200px; padding-inline: 16px; width: 100%; }
    .font-heading-large-bold { font-size: 34px; line-height: 44px; }
    .font-heading-medium-bold { font-size: 26px; line-height: 36px; }
    .font-heading-small-bold { font-size: 20px; line-height: 28px; }
    .font-body-large-regular { font-size: 16px; line-height: 26px; }
    .font-body-medium-regular { font-size: 14px; line-height: 22px; }
    .font-body-small-bold, .font-body-small-regular { font-size: 12px; line-height: 18px; }
    .font-body-small-bold { font-weight: 700; }
    .lpb-surface--weak { background: var(--color-background-weak); }
    @media (min-width: 669px) { .preview-content { padding-inline: 24px; } }
    @media (min-width: 1014px) { .preview-content { padding-inline: 32px; } }
  </style>
</head>
<body>
  <main class="preview-main">
    <div class="preview-content" id="preview-root" aria-live="polite">Vorschau wird geladen …</div>
  </main>
  <script>
    fetch('scaling-editorial-article-with-sidebar.html')
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.text();
      })
      .then(html => {
        const root = document.getElementById('preview-root');
        root.innerHTML = html;
        if (new URLSearchParams(location.search).get('authorDemo') === '1') {
          // Illustration from the user-supplied reference screenshot, not article metadata.
          const label = document.createElement('p');
          label.className = 'font-body-medium-regular';
          label.textContent = 'Lokale Layout-Demo – fiktives Autorenprofil. Das Datumsbeispiel aus dem Referenz-Screenshot gehört nicht zu diesem Artikel.';
          document.querySelector('.preview-main').before(label);
          const date = root.querySelector('.lpb-editorial-author__date');
          date.innerHTML = '<time datetime="2026-09-14T06:00">Veröffentlicht: 14.09.2026, 06:00 Uhr</time>';
          // Name, expertise, portrait and reading time remain those of the canonical payload.
        }
      })
      .catch(error => {
        document.getElementById('preview-root').textContent =
          `Vorschau konnte nicht geladen werden: ${error.message}. Bitte über einen lokalen HTTP-Server öffnen.`;
      });
  </script>
</body>
</html>
