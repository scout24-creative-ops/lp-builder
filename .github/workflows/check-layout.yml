name: Check Contentful layout
on: [pull_request]
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: python3 modules/contentful-runtime/releases/build_layout_v1.py --check
      - run: node modules/contentful-runtime/checks/test_layout.cjs
